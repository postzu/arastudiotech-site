<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mess Zero — get it free</title>
<link rel="canonical" href="https://arastudiotech.com/messzero/jogar/">
<!-- Prévia do link no WhatsApp/Telegram/redes (lida sem JavaScript). -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="AraStudioTech">
<meta property="og:title" content="Bagunça Zero 🧹 Aceita o desafio?">
<meta property="og:description" content="Junte 3 iguais e arrume a casa da Vó. Grátis na Google Play. · Match 3 and tidy up. Free on Google Play.">
<meta property="og:image" content="https://arastudiotech.com/messzero/jogar/og.png">
<meta property="og:url" content="https://arastudiotech.com/messzero/jogar/">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#fbf3e4">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<style>
  :root { --bg: #fbf3e4; --ink: #3b2a1f; --dim: #7a6656; --accent: #e8743b; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; text-align: center;
    background: radial-gradient(120% 60% at 50% 100%, #f6dcc0, var(--bg)); color: var(--ink);
    font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { padding: 24px 16px; width: 100%; max-width: 460px; }
  img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 10px 30px rgba(59, 42, 31, 0.25); }
  h1 { margin: 14px 0 4px; font-size: 30px; color: var(--accent); }
  p { margin: 6px 0; color: var(--dim); }
  .challenge { margin: 14px 0; padding: 12px 14px; border-radius: 16px; background: rgba(232, 116, 59, 0.14); color: var(--ink); font-weight: 700; }
  .challenge[hidden] { display: none; }
  .play { display: inline-block; margin-top: 18px; padding: 14px 26px; border-radius: 18px; text-decoration: none;
    font-weight: 800; font-size: 19px; color: #10351a; background: linear-gradient(180deg, #7cea6a, #33b04a); box-shadow: 0 5px 0 #1d7a33; }
  small { display: block; margin-top: 16px; color: var(--dim); font-size: 13px; }
</style>
</head>
<body>
<main>
  <img src="./favicon.svg" alt="Bagunça Zero">
  <h1 id="h">Bagunça Zero</h1>
  <p id="sub">Junte 3 iguais e arrume a casa da Vó! Grátis.</p>
  <div class="challenge" id="ch" hidden></div>
  <a class="play" id="go" href="https://play.google.com/store/apps/details?id=com.arastudiotech.messzero">▶ Google Play</a>
  <small id="note">Disponível para Android.</small>
  <small><a href="https://arastudiotech.com/" style="color:inherit">AraStudioTech</a></small>
</main>
<script>
/*
 * Link de desafio do app: https://arastudiotech.com/messzero/jogar/?f=<fase>[&t=<segundos>]
 *                      ou                                       ?d=<AAAA-MM-DD>&u=<faixa>[&t=<segundos>]
 * O jogo NÃO roda no navegador: a página mostra o desafio e leva para a Play Store.
 * Android: vai direto para a loja, com o "referrer" (Play Console → origem das instalações).
 */
(function () {
  var APP = 'com.arastudiotech.messzero';
  var q = new URLSearchParams(location.search);
  var num = function (v, min, max) { return v && /^\d{1,6}$/.test(v) && +v >= min && +v <= max ? +v : null; };
  var f = num(q.get('f'), 1, 5000);
  var t = num(q.get('t'), 1, 3600);
  var d = /^\d{4}-\d{2}-\d{2}$/.test(q.get('d') || '') ? q.get('d') : null;
  var time = t ? Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0') : null;
  var medium = f ? 'fase' : d ? 'diario' : 'link';
  var ref = 'utm_source=share&utm_medium=' + medium + '&utm_campaign=viral' + (f ? '&utm_content=fase-' + f : '');
  var url = 'https://play.google.com/store/apps/details?id=' + APP + '&referrer=' + encodeURIComponent(ref);

  var T = {
    pt: { name: 'Bagunça Zero', sub: 'Junte 3 iguais e arrume a casa da Vó! Grátis.', lvl: 'Seu amigo passou da fase {n}{t}. Consegue?', day: 'Seu amigo fez o desafio do dia{t}. Consegue?', tt: ' em {t}', note: 'Disponível para Android.' },
    en: { name: 'Mess Zero', sub: "Match 3 and tidy up Grandma's house! Free.", lvl: 'Your friend beat level {n}{t}. Can you?', day: "Your friend beat today's challenge{t}. Can you?", tt: ' in {t}', note: 'Available for Android.' },
    es: { name: 'Desorden Cero', sub: '¡Junta 3 iguales y ordena la casa de la abuela! Gratis.', lvl: 'Tu amigo pasó el nivel {n}{t}. ¿Puedes?', day: 'Tu amigo superó el reto del día{t}. ¿Puedes?', tt: ' en {t}', note: 'Disponible para Android.' }
  };
  var lang = ((navigator.languages && navigator.languages[0]) || navigator.language || 'pt').toLowerCase().slice(0, 2);
  var L = T[lang] || T.en;
  document.documentElement.lang = T[lang] ? lang : 'en';
  document.title = L.name;
  document.getElementById('h').textContent = L.name;
  document.getElementById('sub').textContent = L.sub;
  document.getElementById('note').textContent = L.note;
  if (f || d) {
    var tt = time ? L.tt.replace('{t}', time) : '';
    var ch = document.getElementById('ch');
    ch.textContent = (f ? L.lvl.replace('{n}', f) : L.day).replace('{t}', tt);
    ch.hidden = false;
  }
  document.getElementById('go').href = url;

  // Android: direto para a loja (sem cliques a mais).
  if (/android/i.test(navigator.userAgent)) location.replace(url);
})();
</script>
</body>
</html>
